<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viewing Booking Agent</title>
<style>
  :root { --bg: #f6f7f9; --panel: #fff; --border: #e3e6eb; --text: #1b1f24; --muted: #667085;
          --accent: #3b5bdb; --accent-text: #fff; --you: #eef2ff; --agent: #e8f6ef; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --panel: #171a21; --border: #2a2f3a; --text: #e6e8eb; --muted: #98a2b3;
            --accent: #6d8cff; --accent-text: #0f1115; --you: #1f2640; --agent: #16302a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .chat { max-width: 720px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  .log { flex: 1; overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
         padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; }
  .you { align-self: flex-end; background: var(--you); }
  .agent { align-self: flex-start; background: var(--agent); }
  .tag { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
         color: var(--muted); margin-bottom: 3px; }
  .body { white-space: pre-wrap; }
  .hint { color: var(--muted); margin: auto; text-align: center; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .suggestions button { font-weight: 400; font-size: 13px; padding: 6px 12px; border-radius: 999px;
                        background: var(--panel); color: var(--text); border: 1px solid var(--border); }
  .suggestions button:hover { border-color: var(--accent); }
  form { display: flex; gap: 8px; margin-top: 12px; }
  input { flex: 1; font: inherit; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
          background: var(--panel); color: var(--text); }
  button { font: inherit; font-weight: 600; padding: 10px 18px; border: 0; border-radius: 8px;
           background: var(--accent); color: var(--accent-text); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="chat">
  <h1>Viewing Booking Agent</h1>
  <div class="log" id="log"><div class="hint" id="hint">Ask to book or cancel a property viewing.</div></div>
  <div class="suggestions" id="suggestions"></div>
  <form id="form">
    <input id="text" placeholder="e.g. Can I see 14 Oak Road on Saturday morning?" autocomplete="off" aria-label="Message">
    <button id="send">Send</button>
  </form>
</div>

<script>
const SENDER = "guest";
const log = document.getElementById("log");
const input = document.getElementById("text");
const button = document.getElementById("send");

function add(cls, text) {
  document.getElementById("hint")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + cls;
  const tag = document.createElement("div");
  tag.className = "tag";
  tag.textContent = cls === "you" ? "Tenant" : "Agent";
  const body = document.createElement("div");
  body.className = "body";
  body.textContent = text;
  div.append(tag, body);
  log.append(div);
  log.scrollTop = log.scrollHeight;
  return body;
}

const SUGGESTIONS = [
  "Hi, can I see the flat at 14 Oak Road on Saturday morning?",
  "Is 22 Elm Street free tomorrow at 5pm? If not, any time after 4 works.",
  "Is 7 Maple Avenue free on Monday?",
  "I want to cancel my viewing.",
  "Can I see 99 Banana Street tomorrow at 10?",
  "I'd like to book a viewing",
];
for (const q of SUGGESTIONS) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = q;
  b.onclick = () => { if (!button.disabled) send(q); };
  document.getElementById("suggestions").append(b);
}

document.getElementById("form").addEventListener("submit", (e) => {
  e.preventDefault();
  send(input.value);
});

async function send(text) {
  text = text.trim();
  if (!text) return;
  add("you", text);
  input.value = "";
  button.disabled = true;
  const pending = add("agent", "…");
  try {
    const r = await fetch("/message", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sender: SENDER, text }),
    });
    const data = await r.json();
    pending.textContent = r.ok ? data.reply : "Sorry, something went wrong.";
  } catch {
    pending.textContent = "Sorry, I couldn't reach the server.";
  }
  button.disabled = false;
  input.focus();
}
input.focus();
</script>
</body>
</html>
