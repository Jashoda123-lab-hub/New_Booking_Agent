<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viewing Booking Agent</title>
<style>
  :root { --bg: #f6f7f9; --panel: #fff; --border: #e3e6eb; --text: #1b1f24; --muted: #667085;
          --accent: #3b5bdb; --accent-text: #fff; --you: #eef2ff; --agent: #e8f6ef; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --panel: #171a21; --border: #2a2f3a; --text: #e6e8eb; --muted: #98a2b3;
            --accent: #6d8cff; --accent-text: #0f1115; --you: #1f2640; --agent: #16302a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .chat { max-width: 720px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  .log { flex: 1; overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
         padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; }
  .you { align-self: flex-end; background: var(--you); }
  .agent { align-self: flex-start; background: var(--agent); }
  .hint { color: var(--muted); margin: auto; text-align: center; }
  form { display: flex; gap: 8px; margin-top: 12px; }
  input { flex: 1; font: inherit; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
          background: var(--panel); color: var(--text); }
  button { font: inherit; font-weight: 600; padding: 10px 18px; border: 0; border-radius: 8px;
           background: var(--accent); color: var(--accent-text); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="chat">
  <h1>Viewing Booking Agent</h1>
  <div class="log" id="log"><div class="hint" id="hint">Ask to book or cancel a property viewing.</div></div>
  <form id="form">
    <input id="text" placeholder="e.g. Can I see 14 Oak Road on Saturday morning?" autocomplete="off" aria-label="Message">
    <button id="send">Send</button>
  </form>
</div>

<script>
const SENDER = "guest";
const log = document.getElementById("log");
const input = document.getElementById("text");
const button = document.getElementById("send");

function add(cls, text) {
  document.getElementById("hint")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  log.append(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  add("you", text);
  input.value = "";
  button.disabled = true;
  const pending = add("agent", "…");
  try {
    const r = await fetch("/message", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sender: SENDER, text }),
    });
    const data = await r.json();
    pending.textContent = r.ok ? data.reply : "Sorry, something went wrong.";
  } catch {
    pending.textContent = "Sorry, I couldn't reach the server.";
  }
  button.disabled = false;
  input.focus();
});
input.focus();
</script>
</body>
</html>
